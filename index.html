  <body class="bg-black text-[#dedbc8]">
    <div id="root">
      <!--
        App shell: a static copy of the hero frame (same classes as Hero.tsx) so the poster — the LCP
        element — paints as soon as it downloads instead of waiting for the JS bundle. React replaces
        this with the live hero on mount; the image is already cached, so there's no visual jump.
      -->
      <section class="h-[100dvh] min-h-[560px] p-3 md:p-5" aria-hidden="true">
        <div class="relative w-full h-full rounded-[1.75rem] md:rounded-[2.25rem] overflow-hidden bg-[#1a150f] ring-1 ring-inset ring-primary/10">
          <img
            src="./media/hero-poster-1440.webp"
            srcset="./media/hero-poster-960.webp 960w, ./media/hero-poster-1440.webp 1440w, ./media/hero-poster-1920.webp 1920w"
            sizes="100vw"
            alt=""
            fetchpriority="high"
            class="absolute inset-0 w-full h-full object-cover"
          />
          <div class="absolute inset-0 bg-gradient-to-b from-black/35 via-transparent to-black/75"></div>
        </div>
      </section>
